name: Update market data

# Fetches fresh VIX, SPX, SPY, RSP daily closes and commits them so Vercel
# redeploys with today's numbers. Runs weekdays after US market close, plus
# a late fallback in case the first run finds Yahoo still lagging.
#
# Manual trigger available from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '30 23 * * 1-5'   # 23:30 UTC weekdays  (~7:30pm ET EDT / 6:30pm ET EST)
    - cron: '30  3 * * 2-6'   # 03:30 UTC next day  (safety catch-up)
  workflow_dispatch:

permissions:
  contents: write  # needed for the bot to push updated CSVs back

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch fresh market data
        run: |
          chmod +x scripts/update-data.sh
          bash scripts/update-data.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl for parsing NAAIM
        run: pip install --quiet openpyxl

      - name: Refresh % of stocks above 200 MA (daily — fetches ~100 tickers from Yahoo)
        run: python scripts/update-pct-above-200ma.py

      - name: Refresh NAAIM (weekly — tolerant of no-new-data)
        run: python scripts/update-naaim.py

      - name: Refresh S&P 500 PE ratio (monthly — tolerant of no-new-data)
        run: python scripts/update-pe-ratio.py

      - name: Refresh Shiller CAPE (monthly — tolerant of no-new-data)
        run: python scripts/update-shiller-cape.py

      - name: Refresh Buffett Indicator (quarterly — tolerant of no-new-data)
        run: python scripts/update-buffett-indicator.py

      - name: Refresh Risk Watch data (credit spreads, yield curve, employment, NBER recession)
        env:
          # Authenticated FRED API — unlocks full history for most series.
          # BofA credit-spread series (BAMLH0A0HYM2, BAMLC0A0CM) are still
          # capped to ~3 years even authenticated (ICE licensing). The
          # build-hy-oas-proxy.py step below back-fills pre-2023 history
          # from HYG/TLT to work around that.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update-risk-watch.py

      - name: Build stitched HY OAS series (FRED + HYG/TLT proxy back to 2007)
        run: python scripts/build-hy-oas-proxy.py

      - name: Refresh CNN Fear & Greed history (whit3rabbit mirror, CNN live fallback)
        run: python scripts/update-fear-greed.py

      - name: Refresh U-Michigan Consumer Sentiment (monthly — tolerant of no-new-data)
        run: python scripts/update-umcsent.py

      - name: Refresh Chicago Fed NFCI (weekly — for the Two-Gate Long/Cash QQQ signal card)
        run: python scripts/update-nfci.py

      - name: Append current-year yields to yields_history.csv
        run: python scripts/update-yields-history.py

      - name: Refresh SPY news from Yahoo (tolerant of no-new-data)
        run: python scripts/update-spy-news.py

      - name: Refresh broad-market news from Yahoo (tolerant of no-new-data)
        run: python scripts/update-market-news.py

      - name: Refresh intraday sector snapshot (safety net for the 10-min bot)
        run: python scripts/update-sectors-intraday.py

      - name: Refresh Nancy Pelosi trades snapshot (tolerant of upstream errors)
        run: python scripts/update-pelosi.py

      - name: Rebuild BATS sector oscillator (must run before moments/history)
        run: python scripts/build-sector-osc.py

      - name: Rebuild Sector Rotation Regime (must run before moments/history)
        run: python scripts/build-sector-regime.py

      - name: Regenerate BATS moments — S&P 500
        run: python scripts/build-bats-moments.py --market=sp500

      - name: Regenerate BATS moments — Nasdaq 100
        run: python scripts/build-bats-moments.py --market=nasdaq

      - name: Regenerate BATS daily history — S&P 500
        run: python scripts/build-bats-history.py --market=sp500

      - name: Regenerate BATS daily history — Nasdaq 100
        run: python scripts/build-bats-history.py --market=nasdaq

      - name: Regenerate Signal Testing backtest (CNN F&G + BATS strategies)
        run: python scripts/backtest-signals.py

      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "BATS.CO Update Bot"
            git config user.email "bot@bats.co"
            git add data/
            git commit -m "chore: refresh market data $(date -u +'%Y-%m-%d')"
            git push
            echo "::notice::Pushed refreshed market data."
          else
            echo "::notice::No data changes today; nothing to commit."
          fi
